name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npm run smoke

      - name: Exercise real local Worker and D1 flows
        run: npm run smoke:local:worker

      - name: Report deployment readiness
        run: npm run check:deploy

      - name: Package Worker dry run
        working-directory: apps/worker
        run: npx wrangler deploy --dry-run

      - name: Package Web Worker dry run
        run: npx wrangler deploy --dry-run --config apps/web/wrangler.toml

      - name: Retain tested web build
        uses: actions/upload-artifact@v4
        with:
          name: film-web-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14
